<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALETHEIA | Alpha Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: linear-gradient(160deg, #06080d 0%, #0a0f1a 30%, #0d1525 60%, #0a0f1a 100%);
            color: #e8edf5;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -200px; right: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0,168,255,0.03) 0%, transparent 70%);
            pointer-events: none;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .logo-diamond { color: #00a8ff; margin-right: 8px; }
        .logo-subtitle { font-size: 11px; font-weight: 500; color: #6b7d99; margin-left: 12px; letter-spacing: 2px; }
        .market-status {
            font-size: 10px;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
        }
        .market-open { background: rgba(0,230,118,0.1); color: #00e676; border: 1px solid rgba(0,230,118,0.2); }
        .market-closed { background: rgba(255,61,92,0.1); color: #ff3d5c; border: 1px solid rgba(255,61,92,0.2); }
        
        /* KPI Cards */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 180, 255, 0.06);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,168,255,0.3), transparent);
        }
        .glass-card:hover {
            border-color: rgba(0,168,255,0.2);
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 80px rgba(0,168,255,0.04);
            transform: translateY(-2px);
        }
        .kpi-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #6b7d99;
            margin-bottom: 8px;
        }
        .kpi-value {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 0%, #a0c8f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }
        .kpi-value.profit { background: linear-gradient(180deg, #00e676 0%, #00c853 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .kpi-value.loss { background: linear-gradient(180deg, #ff3d5c 0%, #d50000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .kpi-sub { font-size: 10px; color: #3d4f66; margin-top: 4px; }
        
        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        
        /* Pulsing dot */
        .pulse-dot {
            width: 8px; height: 8px;
            background: #00e676;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px #00e676;
            animation: pulse 2s ease-in-out infinite;
            margin-right: 6px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.8); }
        }
        
        /* Main content */
        .main-grid {
            display: grid;
            grid-template-columns: 1.8fr 1.2fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #6b7d99;
            margin-bottom: 16px;
        }
        
        /* Signal bars */
        .signal-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 300px;
            padding: 10px 0;
        }
        .signal-bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .signal-bar {
            width: 100%;
            border-radius: 8px 8px 0 0;
            transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 4px;
        }
        .signal-bar.positive { background: linear-gradient(180deg, #00e676, rgba(0,230,118,0.3)); }
        .signal-bar.negative { background: linear-gradient(180deg, #ff3d5c, rgba(255,61,92,0.3)); }
        .signal-bar.neutral { background: linear-gradient(180deg, #6b7d99, rgba(107,125,153,0.3)); }
        .signal-label { font-size: 9px; color: #6b7d99; font-weight: 600; }
        .signal-score { font-size: 8px; font-weight: 700; }
        .signal-score.positive { color: #00e676; }
        .signal-score.negative { color: #ff3d5c; }
        
        /* Position cards */
        .position-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(0, 180, 255, 0.06);
            border-radius: 14px;
            padding: 14px 18px;
            margin: 6px 0;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .position-card:hover { border-color: rgba(0,168,255,0.2); }
        .position-card.profit { border-left-color: #00e676; }
        .position-card.loss { border-left-color: #ff3d5c; }
        .position-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .position-symbol { font-weight: 700; font-size: 15px; }
        .position-qty { color: #6b7d99; font-size: 11px; }
        .position-pnl { font-weight: 700; font-size: 14px; }
        .position-pnl.profit { color: #00e676; animation: glow-green 2s ease-in-out infinite; }
        .position-pnl.loss { color: #ff3d5c; animation: glow-red 2s ease-in-out infinite; }
        .position-pct { font-size: 10px; }
        
        @keyframes glow-green {
            0%, 100% { text-shadow: 0 0 8px rgba(0,230,118,0.3); }
            50% { text-shadow: 0 0 20px rgba(0,230,118,0.6); }
        }
        @keyframes glow-red {
            0%, 100% { text-shadow: 0 0 8px rgba(255,61,92,0.3); }
            50% { text-shadow: 0 0 20px rgba(255,61,92,0.6); }
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: #1a2540;
            font-size: 8px;
            letter-spacing: 3px;
        }
        
        /* Loading */
        .loading { text-align: center; padding: 40px; color: #6b7d99; }
        .spinner {
            width: 30px; height: 30px;
            border: 2px solid rgba(0,168,255,0.1);
            border-top-color: #00a8ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Responsive */
        @media (max-width: 900px) {
            .kpi-row { grid-template-columns: repeat(2, 1fr); }
            .main-grid { grid-template-columns: 1fr; }
            .signal-bars { height: 200px; }
            .kpi-value { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <span class="logo"><span class="logo-diamond">◆</span>ALETHEIA</span>
        <span class="logo-subtitle">ALPHA INTELLIGENCE</span>
    </div>
    <div>
        <span class="pulse-dot"></span>
        <span style="color:#00e676;font-size:10px;">● LIVE</span>
        <span class="market-status market-closed" id="marketStatus">● MARKET CLOSED</span>
    </div>
</div>

<div class="kpi-row" id="kpiRow">
    <div class="glass-card"><div class="loading"><div class="spinner"></div>Loading...</div></div>
</div>

<div class="main-grid">
    <div class="glass-card">
        <div class="section-title">◆ SIGNAL PANORAMA</div>
        <div class="signal-bars" id="signalBars"></div>
    </div>
    <div class="glass-card">
        <div class="section-title">◆ LIVE POSITIONS</div>
        <div id="positions"></div>
    </div>
</div>

<div class="footer">◆ ALETHEIA ALPHA INTELLIGENCE ◆ RESEARCH PROTOTYPE ◆ NOT FINANCIAL ADVICE ◆</div>

<script>
const API = 'http://localhost:8000';

function animateValue(el, start, end, duration, prefix='$', suffix='') {
    const range = end - start;
    const increment = range / (duration / 16);
    let current = start;
    const timer = setInterval(() => {
        current += increment;
        if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
            current = end;
            clearInterval(timer);
        }
        el.textContent = prefix + Math.round(current).toLocaleString() + suffix;
    }, 16);
}

function getMarketStatus() {
    const now = new Date();
    const nyHour = (now.getUTCHours() - 4 + 24) % 24;
    const isOpen = nyHour >= 9 && nyHour < 16 && now.getUTCDay() >= 1 && now.getUTCDay() <= 5;
    const el = document.getElementById('marketStatus');
    el.textContent = isOpen ? '● MARKET OPEN' : '● MARKET CLOSED';
    el.className = 'market-status ' + (isOpen ? 'market-open' : 'market-closed');
}

async function loadData() {
    try {
        // Load signals
        const sigRes = await fetch(API + '/signals');
        const sigData = await sigRes.json();
        
        // Load portfolio
        const portRes = await fetch(API + '/portfolio');
        const portData = await portRes.json();
        
        renderKPIs(portData, sigData);
        renderSignalBars(sigData.signals);
        renderPositions(portData.positions || []);
        getMarketStatus();
    } catch(e) {
        console.error('API Error:', e);
    }
}

function renderKPIs(portfolio, signals) {
    const eq = portfolio.equity || 100000;
    const pnl = portfolio.pnl_today || 0;
    const cash = portfolio.cash || 100000;
    const posCount = portfolio.positions_count || 0;
    const sigCount = signals.count || 0;
    const longs = signals.signals.filter(s => s.direction === 'LONG').length;
    const shorts = signals.signals.filter(s => s.direction === 'SHORT').length;
    const avgScore = signals.signals.length > 0 
        ? signals.signals.reduce((a, s) => a + s.composite_score, 0) / signals.signals.length 
        : 0;
    
    const pnlClass = pnl >= 0 ? 'profit' : 'loss';
    const pnlSign = pnl >= 0 ? '+' : '';
    
    document.getElementById('kpiRow').innerHTML = `
        <div class="glass-card">
            <div class="kpi-label">PORTFOLIO</div>
            <div class="kpi-value ${pnlClass}" id="equityValue">$${Math.round(eq).toLocaleString()}</div>
            <div class="kpi-sub" style="color:${pnl>=0?'#00e676':'#ff3d5c'}">${pnlSign}$${pnl.toLocaleString(undefined,{minimumFractionDigits:2})} TODAY</div>
        </div>
        <div class="glass-card">
            <div class="kpi-label">CASH</div>
            <div class="kpi-value">$${Math.round(cash).toLocaleString()}</div>
            <div class="kpi-sub">${posCount} POSITIONS</div>
        </div>
        <div class="glass-card">
            <div class="kpi-label">SIGNALS</div>
            <div class="kpi-value">${sigCount}</div>
            <div class="kpi-sub">${longs}L / ${shorts}S</div>
        </div>
        <div class="glass-card">
            <div class="kpi-label">AVG SCORE</div>
            <div class="kpi-value ${avgScore>=0?'profit':'loss'}">${avgScore>=0?'+':''}${avgScore.toFixed(3)}</div>
            <div class="kpi-sub" style="color:${avgScore>=0.02?'#00e676':'#ff3d5c'}">${avgScore>=0.02?'BULLISH':'BEARISH'}</div>
        </div>
        <div class="glass-card">
            <div class="kpi-label">DATABASE</div>
            <div class="kpi-value">71K</div>
            <div class="kpi-sub">LIVE</div>
        </div>
    `;
}

function renderSignalBars(signals) {
    const maxScore = Math.max(...signals.map(s => Math.abs(s.composite_score)));
    const container = document.getElementById('signalBars');
    
    container.innerHTML = signals.map(s => {
        const height = Math.max(4, (Math.abs(s.composite_score) / maxScore) * 250);
        const barClass = s.composite_score > 0.02 ? 'positive' : (s.composite_score < -0.02 ? 'negative' : 'neutral');
        const scoreClass = s.composite_score > 0.02 ? 'positive' : (s.composite_score < -0.02 ? 'negative' : '');
        return `
            <div class="signal-bar-wrapper">
                <span class="signal-score ${scoreClass || ''}">${s.composite_score>=0?'+':''}${s.composite_score.toFixed(3)}</span>
                <div class="signal-bar ${barClass}" style="height:${height}px"></div>
                <span class="signal-label">${s.ticker}</span>
            </div>
        `;
    }).join('');
}

function renderPositions(positions) {
    const container = document.getElementById('positions');
    
    if (positions.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7d99;">No positions</div>';
        return;
    }
    
    container.innerHTML = positions.map(p => {
        const pl = p.unrealized_pl || 0;
        const isProfit = pl >= 0;
        const cardClass = isProfit ? 'profit' : 'loss';
        const pnlClass = isProfit ? 'profit' : 'loss';
        const sign = isProfit ? '+' : '';
        return `
            <div class="position-card ${cardClass}">
                <div class="position-row">
                    <span class="position-symbol">${isProfit?'🟢':'🔴'} ${p.symbol}</span>
                    <span class="position-qty">${p.quantity} sh</span>
                    <span class="position-pnl ${pnlClass}">${sign}$${Math.abs(pl).toLocaleString(undefined,{minimumFractionDigits:2})}</span>
                    <span class="position-pct" style="color:${isProfit?'#00e676':'#ff3d5c'}">(${sign}${p.unrealized_pl_pct || 0}%)</span>
                </div>
            </div>
        `;
    }).join('');
}

// Load on start
loadData();

// Auto-refresh every 10 seconds
setInterval(loadData, 10000);

// Update market status every minute
setInterval(getMarketStatus, 60000);
</script>
</body>
</html>
